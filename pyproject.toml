[tool.poetry]
name = "memeqa"
version = "0.1.0"
description = ""
authors = ["Khoi Nguyen <npnkhoi@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
label-studio-sdk = "^1.0.5"
spacy = "^3.8.2"
wandb = "^0.18.5"
torch = {version = "2.4.1+cu118", source = "pytorch-gpu-src"}
torchvision = {version = "0.19.1+cu118", source = "pytorch-gpu-src"}
transformers = { git = "https://github.com/huggingface/transformers.git", rev = "main" }
accelerate = "^1.0.1"
pytest = "^8.3.3"
typing-extensions = "^4.12.2"
python-dotenv = "^1.0.1"
matplotlib = "^3.9.3"
peft = "^0.14.0"
bitsandbytes = "0.44.1"
datasets = "^3.2.0"
ipywidgets = "^8.1.5"
tiktoken = "^0.9.0"
openai = "^1.69.0"


[[tool.poetry.source]]
name = "pytorch-gpu-src"
url = "https://download.pytorch.org/whl/cu118"
priority = "explicit"


[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
